<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>باشگاه سوارکاری هوراز</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:tahoma;
}

body{
    background:linear-gradient(135deg,#0f5132,#198754);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    padding:30px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.logo{
    width:130px;
    height:130px;
    object-fit:contain;
    margin-bottom:15px;
}

h1{
    color:white;
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    color:#d9f7e3;
    font-size:14px;
    margin-bottom:25px;
    line-height:1.8;
}

.btn{
    display:block;
    text-decoration:none;
    background:white;
    color:#0f5132;
    padding:16px;
    margin:12px 0;
    border-radius:16px;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

.footer{
    margin-top:25px;
    color:#e8fff0;
    font-size:13px;
    line-height:1.8;
}
</style>

</head>
<body>

<div class="card">

    <img src="logo.png" class="logo" alt="Horaz Horse Club">

    <h1>باشگاه سوارکاری هوراز</h1>

    <div class="subtitle">
        آموزش سوارکاری<br>
        فروش اسب<br>
        پانسیون اسب
    </div>

    <a class="btn" href="https://instagram.com/horaz_horse_club" target="_blank">
        📷 اینستاگرام
    </a>

    <a class="btn" href="https://t.me/horaz_horse_club" target="_blank">
        ✈️ تلگرام
    </a>

    <a class="btn" href="https://rubika.ir/horaz_horse_club" target="_blank">
        💬 روبیکا
    </a>

    <a class="btn" href="https://maps.google.com/?q=34.25102,47.03964" target="_blank">
        📍 لوکیشن باشگاه هوراز
    </a>

    <div class="footer">
        Horaz Horse Club
        <br>
        ارتباط سریع با مجموعه هوراز
    </div>

</div>

</body>
</html>
